[package]
name = "irodori-extension-s3-tables"
version = "0.1.5"
edition = "2021"
license = "0BSD"
description = "Native Irodori Table connector extension for S3 Tables."
repository = "https://github.com/irodori-table/irodori-extension-s3-tables"
readme = "README.md"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-*",
  "connector.config.json",
  "connector.source.json",
  "irodori.extension.json",
  "src/**",
  "native/source/**",
]

[lib]
name = "irodori_extension_s3_tables"
crate-type = ["cdylib", "rlib"]

[dependencies]
irodori-connector-abi = { git = "https://github.com/irodori-table/irodori-kit", tag = "v0.7.8" }
duckdb = { version = "1", default-features = false }
serde_json = "1"

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
